<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>숲 속 서재</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="숲 속 서재" />
<meta name="theme-color" content="#3f5a45" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #eef2ea;
    font-family: 'EB Garamond', Georgia, serif;
    color: #2f3b2f;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 22px 16px 40px 16px; }
  .eyebrow { font-size: 11px; letter-spacing: 2px; color: #3f5a45; text-transform: uppercase; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 500; color: #2b4030; margin: 2px 0 0 0; }
  .counts { display: flex; gap: 14px; margin: 16px 0 18px 0; }
  .count-card { flex: 1; background: #fbf9f3; border: 1px solid #d8e0d2; border-radius: 10px; padding: 8px 10px; }
  .count-num { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; color: #2b4030; }
  .count-label { font-size: 10.5px; color: #6b7a67; margin-top: 1px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn, .status-btn, .edition-btn {
    font-family: 'EB Garamond', Georgia, serif; font-size: 12.5px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid #d8e0d2; background: transparent; color: #6b7a67; cursor: pointer;
  }
  .tab-btn.active, .status-btn.active { border-color: #3f5a45; background: #3f5a45; color: #fff; }
  .add-btn {
    width: 100%; padding: 11px; margin-bottom: 16px; border-radius: 10px;
    border: 1px dashed #3f5a45; background: transparent; color: #3f5a45; font-size: 13px; cursor: pointer;
  }
  .book-card { background: #fbf9f3; border-radius: 14px; margin-bottom: 10px; overflow: hidden; border: 1px solid #d8e0d2; }
  .book-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .spine { width: 10px; height: 44px; border-radius: 3px; flex-shrink: 0; }
  .cover-thumb { width: 34px; height: 44px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .book-title { font-family: 'Playfair Display', Georgia, serif; font-size: 16px; font-weight: 500; color: #2f3b2f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-line { font-size: 12.5px; color: #6b7a67; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-main { flex: 1; min-width: 0; }
  .chevron { color: #6b7a67; font-size: 12px; transition: transform 0.15s; }
  .chevron.open { transform: rotate(90deg); }
  .stars span { font-size: 16px; cursor: pointer; color: #d8e0d2; line-height: 1; user-select: none; }
  .stars span.filled { color: #c98a72; }
  .stars.small span { font-size: 11px; cursor: default; }
  .detail { padding: 4px 16px 18px 16px; border-top: 1px solid #d8e0d2; display: none; }
  .detail.open { display: block; }
  .field { margin-bottom: 12px; }
  .field-label { font-size: 11.5px; color: #6b7a67; margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 8px;
    border: 1px solid #d8e0d2; background: #fff; font-family: 'EB Garamond', Georgia, serif;
    font-size: 13.5px; color: #2f3b2f; outline: none;
  }
  .field textarea { min-height: 64px; resize: vertical; }
  .status-row { display: flex; gap: 6px; }
  .delete-link { margin-top: 4px; background: transparent; border: none; color: #c98a72; font-size: 12.5px; cursor: pointer; padding: 0; }
  .empty { text-align: center; color: #6b7a67; font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">forest shelf</div>
  <h1>숲 속 서재</h1>

  <div class="counts" id="counts"></div>
  <div class="tabs" id="tabs"></div>
  <button class="add-btn" id="addBtn">+ 새 책 기록하기</button>
  <div id="bookList"></div>
</div>

<script>
const STORAGE_KEY = "forest-shelf-books";
const SPINE_COLORS = ["#8fae86", "#c9b26a", "#b98a72", "#7c9a99", "#a68bb0", "#c9a15a"];
const STATUSES = ["읽고 싶은 책", "읽는 중", "읽은 책"];
const TABS = ["전체", ...STATUSES];

function loadBooks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [{
    id: 1, title: "숲의 소리를 듣는 시간", status: "읽은 책", rating: 5,
    line: "고요함이 이렇게 큰 위로가 될 줄이야.",
    thoughts: "바쁠 때일수록 잠깐 멈춰서 숨을 고르는 연습이 필요하다는 걸 다시 느꼈다.",
    cover: "", spine: 0
  }];
}

let books = loadBooks();
let currentTab = "전체";
let openId = null;

function saveBooks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function starsHtml(rating, size, readOnly, bookId) {
  let html = '<div class="stars' + (readOnly ? ' small' : '') + '">';
  for (let n = 1; n <= 5; n++) {
    const filled = n <= rating ? " filled" : "";
    if (readOnly) {
      html += '<span class="' + filled.trim() + '">●</span>';
    } else {
      html += '<span class="' + filled.trim() + '" data-book="' + bookId + '" data-rate="' + n + '">●</span>';
    }
  }
  html += "</div>";
  return html;
}

function render() {
  renderCounts();
  renderTabs();
  renderBooks();
}

function renderCounts() {
  const counts = {};
  STATUSES.forEach(s => counts[s] = books.filter(b => b.status === s).length);
  const el = document.getElementById("counts");
  el.innerHTML = STATUSES.map(s =>
    '<div class="count-card"><div class="count-num">' + counts[s] + '</div><div class="count-label">' + s + '</div></div>'
  ).join("");
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(t =>
    '<button class="tab-btn' + (t === currentTab ? ' active' : '') + '" data-tab="' + t + '">' + t + '</button>'
  ).join("");
  el.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => { currentTab = btn.dataset.tab; render(); });
  });
}

function renderBooks() {
  const visible = currentTab === "전체" ? books : books.filter(b => b.status === currentTab);
  const el = document.getElementById("bookList");

  if (visible.length === 0) {
    el.innerHTML = '<div class="empty">아직 이 서가에는 책이 없어요.</div>';
    return;
  }

  el.innerHTML = visible.map(book => {
    const spineColor = SPINE_COLORS[book.spine % SPINE_COLORS.length];
    const isOpen = openId === book.id;
    const coverImg = book.cover ? '<img class="cover-thumb" src="' + escapeHtml(book.cover) + '" alt="" />' : "";
    const lineHtml = book.line ? '<div class="book-line">' + escapeHtml(book.line) + '</div>' : "";
    const ratingBadge = book.rating > 0 ? starsHtml(book.rating, 11, true) : "";

    return '<div class="book-card">' +
      '<div class="book-row" data-toggle="' + book.id + '">' +
        '<div class="spine" style="background:' + spineColor + '"></div>' +
        coverImg +
        '<div class="row-main">' +
          '<div class="book-title">' + (escapeHtml(book.title) || "제목 없는 책") + '</div>' +
          lineHtml +
        '</div>' +
        ratingBadge +
        '<span class="chevron' + (isOpen ? ' open' : '') + '">›</span>' +
      '</div>' +
      '<div class="detail' + (isOpen ? ' open' : '') + '">' +
        '<div class="field"><div class="field-label">책 제목</div>' +
          '<input type="text" data-field="title" data-book="' + book.id + '" value="' + escapeHtml(book.title) + '" placeholder="책 제목을 입력하세요" /></div>' +
        '<div class="field"><div class="field-label">책 커버 이미지 URL (선택)</div>' +
          '<input type="text" data-field="cover" data-book="' + book.id + '" value="' + escapeHtml(book.cover) + '" placeholder="https://..." /></div>' +
        '<div class="field"><div class="field-label">읽음 상태</div><div class="status-row">' +
          STATUSES.map(s =>
            '<button class="status-btn' + (book.status === s ? ' active' : '') + '" data-book="' + book.id + '" data-status="' + s + '">' + s + '</button>'
          ).join("") +
        '</div></div>' +
        '<div class="field"><div class="field-label">평점</div>' + starsHtml(book.rating, 22, false, book.id) + '</div>' +
        '<div class="field"><div class="field-label">한줄평</div>' +
          '<input type="text" data-field="line" data-book="' + book.id + '" value="' + escapeHtml(book.line) + '" placeholder="이 책을 한 문장으로 표현하면" /></div>' +
        '<div class="field"><div class="field-label">생각할 거리</div>' +
          '<textarea data-field="thoughts" data-book="' + book.id + '" placeholder="이 책이 남긴 질문이나 생각">' + escapeHtml(book.thoughts) + '</textarea></div>' +
        '<button class="delete-link" data-delete="' + book.id + '">이 기록 삭제</button>' +
      '</div>' +
    '</div>';
  }).join("");

  attachBookEvents();
}

function attachBookEvents() {
  document.querySelectorAll("[data-toggle]").forEach(row => {
    row.addEventListener("click", () => {
      const id = Number(row.dataset.toggle);
      openId = openId === id ? null : id;
      render();
    });
  });

  document.querySelectorAll("input[data-field], textarea[data-field]").forEach(input => {
    input.addEventListener("click", e => e.stopPropagation());
    input.addEventListener("input", () => {
      const id = Number(input.dataset.book);
      const field = input.dataset.field;
      const book = books.find(b => b.id === id);
      if (book) { book[field] = input.value; saveBooks(); renderCounts(); }
    });
  });

  document.querySelectorAll(".status-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = Number(btn.dataset.book);
      const book = books.find(b => b.id === id);
      if (book) { book.status = btn.dataset.status; saveBooks(); render(); }
    });
  });

  document.querySelectorAll(".stars span[data-book]").forEach(star => {
    star.addEventListener("click", e => {
      e.stopPropagation();
      const id = Number(star.dataset.book);
      const rate = Number(star.dataset.rate);
      const book = books.find(b => b.id === id);
      if (book) { book.rating = book.rating === rate ? 0 : rate; saveBooks(); render(); }
    });
  });

  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = Number(btn.dataset.delete);
      books = books.filter(b => b.id !== id);
      if (openId === id) openId = null;
      saveBooks();
      render();
    });
  });
}

document.getElementById("addBtn").addEventListener("click", () => {
  const id = Date.now();
  books.unshift({ id, title: "", status: "읽고 싶은 책", rating: 0, line: "", thoughts: "", cover: "", spine: books.length });
  openId = id;
  currentTab = "전체";
  saveBooks();
  render();
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
