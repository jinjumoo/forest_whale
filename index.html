<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>숲 속 서재</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="숲 속 서재" />
<meta name="theme-color" content="#3f5a45" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener('error', function(e) {
  document.getElementById('root').innerHTML =
    '<pre style="padding:20px;color:red;white-space:pre-wrap;">에러 발생: ' + e.message + '</pre>';
});
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const FONT_DISPLAY = "'Playfair Display', Georgia, serif";
const FONT_BODY = "'EB Garamond', Georgia, serif";

const PALETTE = {
  bg: "#eef2ea", card: "#fbf9f3", ink: "#2f3b2f", inkSoft: "#6b7a67",
  line: "#d8e0d2", forest: "#3f5a45", forestDeep: "#2b4030", rose: "#c98a72",
};
const SPINE_COLORS = ["#8fae86", "#c9b26a", "#b98a72", "#7c9a99", "#a68bb0", "#c9a15a"];
const STORAGE_KEY = "forest-shelf-books";

function loadBooks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [
    { id: 1, title: "숲의 소리를 듣는 시간", status: "읽은 책", rating: 5,
      line: "고요함이 이렇게 큰 위로가 될 줄이야.",
      thoughts: "바쁠 때일수록 잠깐 멈춰서 숨을 고르는 연습이 필요하다는 걸 다시 느꼈다.",
      cover: "", spine: 0 },
  ];
}

function Stars({ value, onChange, size = 16, readOnly = false }) {
  return (
    <div style={{ display: "flex", gap: 2 }}>
      {[1,2,3,4,5].map((n) => (
        <span key={n} onClick={() => !readOnly && onChange && onChange(n === value ? 0 : n)}
          style={{ fontSize: size, cursor: readOnly ? "default" : "pointer",
            color: n <= value ? PALETTE.rose : PALETTE.line, lineHeight: 1, userSelect: "none" }}>
          ●
        </span>
      ))}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontFamily: FONT_BODY, fontSize: 11.5, color: PALETTE.inkSoft, marginBottom: 5 }}>{label}</div>
      {children}
    </div>
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "9px 11px", borderRadius: 8,
  border: `1px solid ${PALETTE.line}`, background: "#fff", fontFamily: FONT_BODY,
  fontSize: 13.5, color: PALETTE.ink, outline: "none",
};

function BookRow({ book, isOpen, onToggle, onUpdate, onDelete }) {
  const spineColor = SPINE_COLORS[book.spine % SPINE_COLORS.length];
  return (
    <div style={{ background: PALETTE.card, borderRadius: 14, marginBottom: 10, overflow: "hidden",
      boxShadow: isOpen ? "0 2px 14px rgba(43,64,48,0.08)" : "none", border: `1px solid ${PALETTE.line}` }}>
      <div onClick={onToggle} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", cursor: "pointer" }}>
        <div style={{ width: 10, height: 44, borderRadius: 3, background: spineColor, flexShrink: 0 }} />
        {book.cover ? <img src={book.cover} alt="" style={{ width: 34, height: 44, objectFit: "cover", borderRadius: 4, flexShrink: 0 }} /> : null}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: FONT_DISPLAY, fontSize: 16, fontWeight: 500, color: PALETTE.ink,
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {book.title || "제목 없는 책"}
          </div>
          {book.line ? <div style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: PALETTE.inkSoft, marginTop: 2,
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{book.line}</div> : null}
        </div>
        {book.rating > 0 && <Stars value={book.rating} readOnly size={11} />}
        <span style={{ color: PALETTE.inkSoft, fontSize: 12, transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s" }}>›</span>
      </div>
      {isOpen && (
        <div style={{ padding: "4px 16px 18px 16px", borderTop: `1px solid ${PALETTE.line}` }}>
          <Field label="책 제목">
            <input value={book.title} onChange={(e) => onUpdate({ ...book, title: e.target.value })} style={inputStyle} placeholder="책 제목을 입력하세요" />
          </Field>
          <Field label="책 커버 이미지 URL (선택)">
            <input value={book.cover} onChange={(e) => onUpdate({ ...book, cover: e.target.value })} style={inputStyle} placeholder="https://..." />
          </Field>
          <Field label="읽음 상태">
            <div style={{ display: "flex", gap: 6 }}>
              {["읽고 싶은 책", "읽는 중", "읽은 책"].map((s) => (
                <button key={s} onClick={() => onUpdate({ ...book, status: s })}
                  style={{ fontFamily: FONT_BODY, fontSize: 12, padding: "6px 10px", borderRadius: 999,
                    border: `1px solid ${book.status === s ? PALETTE.forest : PALETTE.line}`,
                    background: book.status === s ? PALETTE.forest : "transparent",
                    color: book.status === s ? "#fff" : PALETTE.inkSoft, cursor: "pointer" }}>
                  {s}
                </button>
              ))}
            </div>
          </Field>
          <Field label="평점"><Stars value={book.rating} onChange={(v) => onUpdate({ ...book, rating: v })} size={22} /></Field>
          <Field label="한줄평">
            <input value={book.line} onChange={(e) => onUpdate({ ...book, line: e.target.value })} style={inputStyle} placeholder="이 책을 한 문장으로 표현하면" />
          </Field>
          <Field label="생각할 거리">
            <textarea value={book.thoughts} onChange={(e) => onUpdate({ ...book, thoughts: e.target.value })}
              style={{ ...inputStyle, minHeight: 64, resize: "vertical" }} placeholder="이 책이 남긴 질문이나 생각" />
          </Field>
          <button onClick={onDelete} style={{ marginTop: 4, background: "transparent", border: "none", color: PALETTE.rose,
            fontFamily: FONT_BODY, fontSize: 12.5, cursor: "pointer", padding: 0 }}>이 기록 삭제</button>
        </div>
      )}
    </div>
  );
}

function ForestShelf() {
  const [books, setBooks] = useState(loadBooks);
  const [tab, setTab] = useState("전체");
  const [openId, setOpenId] = useState(null);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
  }, [books]);

  const tabs = ["전체", "읽고 싶은 책", "읽는 중", "읽은 책"];
  const visible = tab === "전체" ? books : books.filter((b) => b.status === tab);

  const addBook = () => {
    const id = Date.now();
    setBooks([{ id, title: "", status: "읽고 싶은 책", rating: 0, line: "", thoughts: "", cover: "", spine: books.length }, ...books]);
    setOpenId(id);
    setTab("전체");
  };
  const updateBook = (updated) => setBooks(books.map((b) => (b.id === updated.id ? updated : b)));
  const deleteBook = (id) => { setBooks(books.filter((b) => b.id !== id)); setOpenId(null); };

  const counts = {
    "읽고 싶은 책": books.filter((b) => b.status === "읽고 싶은 책").length,
    "읽는 중": books.filter((b) => b.status === "읽는 중").length,
    "읽은 책": books.filter((b) => b.status === "읽은 책").length,
  };

  return (
    <div style={{ background: PALETTE.bg, minHeight: "100vh", padding: "22px 16px 40px 16px", fontFamily: FONT_BODY }}>
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        <div style={{ marginBottom: 4 }}>
          <div style={{ fontFamily: FONT_BODY, fontSize: 11, letterSpacing: 2, color: PALETTE.forest, textTransform: "uppercase" }}>forest shelf</div>
          <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 28, fontWeight: 500, color: PALETTE.forestDeep, margin: "2px 0 0 0" }}>숲 속 서재</h1>
        </div>
        <div style={{ display: "flex", gap: 14, margin: "16px 0 18px 0" }}>
          {Object.entries(counts).map(([label, n]) => (
            <div key={label} style={{ flex: 1, background: PALETTE.card, border: `1px solid ${PALETTE.line}`, borderRadius: 10, padding: "8px 10px" }}>
              <div style={{ fontFamily: FONT_DISPLAY, fontSize: 18, color: PALETTE.forestDeep }}>{n}</div>
              <div style={{ fontSize: 10.5, color: PALETTE.inkSoft, marginTop: 1 }}>{label}</div>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {tabs.map((t) => (
            <button key={t} onClick={() => setTab(t)}
              style={{ fontFamily: FONT_BODY, fontSize: 12.5, padding: "7px 12px", borderRadius: 999,
                border: `1px solid ${tab === t ? PALETTE.forest : PALETTE.line}`,
                background: tab === t ? PALETTE.forest : "transparent",
                color: tab === t ? "#fff" : PALETTE.inkSoft, cursor: "pointer" }}>
              {t}
            </button>
          ))}
        </div>
        <button onClick={addBook} style={{ width: "100%", padding: "11px", marginBottom: 16, borderRadius: 10,
          border: `1px dashed ${PALETTE.forest}`, background: "transparent", color: PALETTE.forest,
          fontFamily: FONT_BODY, fontSize: 13, cursor: "pointer" }}>+ 새 책 기록하기</button>
        {visible.length === 0 ? (
          <div style={{ textAlign: "center", color: PALETTE.inkSoft, fontSize: 13, padding: "30px 0" }}>아직 이 서가에는 책이 없어요.</div>
        ) : (
          visible.map((book) => (
            <BookRow key={book.id} book={book} isOpen={openId === book.id}
              onToggle={() => setOpenId(openId === book.id ? null : book.id)}
              onUpdate={updateBook} onDelete={() => deleteBook(book.id)} />
          ))
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ForestShelf />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
